<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADK LaBs Invoice System</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f5f5f5;
            padding: 15px;
            color: #111;
        }
        
        .container {
            max-width: 100%;
            margin: 0 auto;
        }
        
        .tabs {
            display: flex;
            background: #2c3e50;
            border-radius: 10px 10px 0 0;
            overflow: hidden;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .tab-btn {
            flex: 1;
            min-width: 120px;
            padding: 15px 10px;
            background: none;
            border: none;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            white-space: nowrap;
        }
        
        .tab-btn.active {
            background: #34495e;
        }
        
        .tab-content {
            display: none;
            animation: fadeIn 0.3s;
        }
        
        .tab-content.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .card h3 {
            color: #1a2b3c;
            margin-bottom: 15px;
            font-size: 18px;
            border-bottom: 2px solid #1a2b3c;
            padding-bottom: 8px;
        }
        
        .data-bar {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #2c3e50;
        }
        
        .data-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 15px;
        }
        
        .data-stat {
            text-align: center;
            flex: 1;
            min-width: 120px;
        }
        
        .data-stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #1a2b3c;
            display: block;
        }
        
        .data-stat-label {
            font-size: 14px;
            color: #333;
        }
        
        .data-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #222;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 16px;
            color: #000;
            background: #fff;
        }
        
        .product-row {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        
        .product-inputs {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        
        .product-inputs input {
            flex: 1;
            min-width: 120px;
        }
        
        .payment-options {
            display: flex;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        
        .payment-option {
            flex: 1;
            min-width: 150px;
        }
        
        .payment-option label {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 2px solid #bbb;
            border-radius: 6px;
            cursor: pointer;
            background: white;
        }
        
        .payment-option input[type="radio"] {
            display: none;
        }
        
        .payment-option input[type="radio"]:checked + label {
            border-color: #2c3e50;
            background: #e8f0fe;
            font-weight: bold;
        }
        
        .totals {
            background: #2c3e50;
            color: white;
            padding: 15px;
            border-radius: 6px;
            margin: 15px 0;
        }
        
        .total-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.2);
        }
        
        .grand-total {
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
        }
        
        .button-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        
        .btn {
            padding: 14px 10px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            color: white;
        }
        
        .btn-primary { background: #2c3e50; }
        .btn-success { background: #1e7e34; }
        .btn-danger { background: #c82333; }
        .btn-whatsapp { background: #128C7E; }
        .btn-info { background: #117a8b; }
        .btn-warning { background: #d39e00; }
        .btn-export { background: #6f42c1; }
        .btn-small { padding: 6px 10px; font-size: 12px; }
        .btn-email { background: #b33c2f; }
        
        .invoice-preview {
            display: none;
            background: white;
            padding: 20px;
            border: 2px solid #2c3e50;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .orders-container, .customers-container {
            margin-top: 20px;
        }
        
        .order-card, .customer-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .order-card { border-left: 4px solid #2c3e50; }
        .customer-card { border-left: 4px solid #1e7e34; }
        
        .search-box {
            margin-bottom: 20px;
            position: relative;
        }
        
        .search-box input {
            padding: 12px 40px 12px 15px;
            border: 2px solid #2c3e50;
            border-radius: 6px;
            width: 100%;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1e7e34;
            color: white;
            padding: 15px 20px;
            border-radius: 6px;
            display: none;
            z-index: 1001;
        }
        
        .toast.error { background: #c82333; }
        
        @media (max-width: 768px) {
            .tabs { flex-direction: column; }
            .product-inputs { flex-direction: column; }
            .button-group { grid-template-columns: 1fr; }
        }
        
        @media print {
            body * { visibility: hidden; }
            .invoice-preview, .invoice-preview * { visibility: visible; }
            .invoice-preview {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background: white;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center; margin-bottom: 15px; color: #1a2b3c;">ADK LaBs® Invoice System</h1>
        
        <div class="data-bar">
            <div class="data-stats">
                <div class="data-stat">
                    <span class="data-stat-value" id="ordersCount">0</span>
                    <span class="data-stat-label">Orders</span>
                </div>
                <div class="data-stat">
                    <span class="data-stat-value" id="customersCount">0</span>
                    <span class="data-stat-label">Customers</span>
                </div>
                <div class="data-stat">
                    <span class="data-stat-value" id="revenueCount">0</span>
                    <span class="data-stat-label">Revenue (PKR)</span>
                </div>
            </div>
            <div class="data-actions">
                <button class="btn btn-export" onclick="exportData()">📤 Export All Data</button>
                <button class="btn btn-warning" onclick="showImportModal()">📥 Import Data</button>
                <button class="btn btn-danger" onclick="clearAllData()">🗑️ Clear All Data</button>
            </div>
        </div>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('create')">➕ Create</button>
            <button class="tab-btn" onclick="switchTab('orders')">📋 Orders</button>
            <button class="tab-btn" onclick="switchTab('customers')">👥 Customers</button>
        </div>
        
        <div id="create" class="tab-content active">
            <div class="card">
                <h3>👤 Customer Information</h3>
                <input type="text" id="customerName" placeholder="Full Name *">
                <input type="tel" id="customerPhone" placeholder="Phone Number *" style="margin-top:10px">
                <textarea id="customerAddress" placeholder="Complete Address" rows="3" style="margin-top:10px"></textarea>
            </div>
            
            <div class="card">
                <h3>🛒 Products</h3>
                <div id="productsContainer">
                    <div class="product-row">
                        <div class="product-inputs">
                            <input type="text" class="productName" placeholder="Product Name">
                            <input type="number" class="productQty" placeholder="Qty" value="1">
                            <input type="number" class="productPrice" placeholder="Price (PKR)">
                        </div>
                        <button class="btn btn-danger" onclick="removeProduct(this)">Remove</button>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="addProduct()">+ Add Product</button>
            </div>
            
            <div class="card">
                <h3>💰 Payment Method</h3>
                <div class="payment-options">
                    <div class="payment-option">
                        <input type="radio" id="cod" name="payment" value="COD" checked>
                        <label for="cod">💰 Cash on Delivery</label>
                    </div>
                    <div class="payment-option">
                        <input type="radio" id="advance" name="payment" value="Advance">
                        <label for="advance">✅ Advance Payment</label>
                    </div>
                </div>
                <div id="advanceDetails" style="display:none">
                    <input type="number" id="advanceAmount" placeholder="Advance Amount" style="margin-top:10px">
                    <input type="text" id="paymentMethod" placeholder="Payment Method" style="margin-top:10px">
                    <input type="text" id="transactionId" placeholder="Transaction ID" style="margin-top:10px">
                </div>
            </div>
            
            <div class="card">
                <h3>📋 Order Details</h3>
                <input type="number" id="discount" placeholder="Discount (PKR)" value="0">
                <input type="number" id="shipping" placeholder="Shipping Charges" value="0" style="margin-top:10px">
                <input type="text" id="courier" placeholder="Courier Service" style="margin-top:10px">
                <input type="text" id="tracking" placeholder="Tracking Number" style="margin-top:10px">
                <input type="text" id="invoiceNo" placeholder="Invoice Number" style="margin-top:10px">
                <input type="date" id="orderDate" style="margin-top:10px">
            </div>
            
            <div class="totals">
                <div class="total-row"><span>Subtotal:</span><span id="subtotalDisplay">0 PKR</span></div>
                <div class="total-row"><span>Discount:</span><span id="discountDisplay">0 PKR</span></div>
                <div class="total-row"><span>Shipping:</span><span id="shippingDisplay">0 PKR</span></div>
                <div class="total-row grand-total"><span>BALANCE DUE:</span><span id="balanceDisplay">0 PKR</span></div>
            </div>
            
            <div class="card">
                <div class="button-group">
                    <button class="btn btn-success" onclick="saveOrder()">💾 Save</button>
                    <button class="btn btn-primary" onclick="viewInvoice()">👁️ View</button>
                    <button class="btn btn-whatsapp" onclick="shareInvoice()">📱 WhatsApp</button>
                    <button class="btn btn-info" onclick="clearForm()">🗑️ Clear</button>
                </div>
            </div>
            
            <div id="invoicePreview" class="invoice-preview"></div>
        </div>
        
        <div id="orders" class="tab-content">
            <div class="card">
                <h3>📋 All Orders</h3>
                <div class="search-box">
                    <input type="text" id="searchOrders" placeholder="Search orders...">
                </div>
                <div id="ordersContainer" class="orders-container"></div>
            </div>
        </div>
        
        <div id="customers" class="tab-content">
            <div class="card">
                <h3>👥 Customers</h3>
                <div class="search-box">
                    <input type="text" id="searchCustomers" placeholder="Search customers...">
                </div>
                <div id="customersContainer" class="customers-container"></div>
            </div>
        </div>
    </div>
    
    <div id="importModal" class="modal">
        <div class="modal-content">
            <h3>📥 Import Data</h3>
            <textarea id="importData" rows="10" style="width:100%; margin:15px 0"></textarea>
            <button class="btn btn-success" onclick="importData()">Import</button>
            <button class="btn btn-danger" onclick="hideImportModal()">Cancel</button>
        </div>
    </div>
    
    <div id="toast" class="toast"></div>

    <script>
        let currentOrder = {};
        let allOrders = [];
        let allCustomers = [];
        
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('orderDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('invoiceNo').value = generateInvoiceNumber();
            
            document.querySelectorAll('input[name="payment"]').forEach(radio => {
                radio.addEventListener('change', function() {
                    document.getElementById('advanceDetails').style.display = this.value === 'Advance' ? 'block' : 'none';
                    calculateTotal();
                });
            });
            
            document.getElementById('searchOrders').addEventListener('input', searchOrders);
            document.getElementById('searchCustomers').addEventListener('input', searchCustomers);
            
            loadAllData();
            updateStats();
            calculateTotal();
        });
        
        function updateStats() {
            document.getElementById('ordersCount').textContent = allOrders.length;
            document.getElementById('customersCount').textContent = allCustomers.length;
            const revenue = allOrders.reduce((sum, order) => sum + order.details.total, 0);
            document.getElementById('revenueCount').textContent = revenue.toFixed(2);
        }
        
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            if (tabName === 'orders') loadOrdersCards();
            if (tabName === 'customers') loadCustomersCards();
        }
        
        function generateInvoiceNumber() {
            const now = new Date();
            return 'INV-' + now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') + '-' + String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0');
        }
        
        function addProduct() {
            const container = document.getElementById('productsContainer');
            const div = document.createElement('div');
            div.className = 'product-row';
            div.innerHTML = `<div class="product-inputs"><input type="text" class="productName" placeholder="Product Name"><input type="number" class="productQty" placeholder="Qty" value="1"><input type="number" class="productPrice" placeholder="Price (PKR)"></div><button class="btn btn-danger" onclick="removeProduct(this)">Remove</button>`;
            container.appendChild(div);
            calculateTotal();
        }
        
        function removeProduct(btn) {
            if (document.querySelectorAll('.product-row').length > 1) {
                btn.closest('.product-row').remove();
                calculateTotal();
            }
        }
        
        function calculateTotal() {
            let subtotal = 0;
            document.querySelectorAll('.product-row').forEach(row => {
                const qty = parseFloat(row.querySelector('.productQty').value) || 0;
                const price = parseFloat(row.querySelector('.productPrice').value) || 0;
                subtotal += qty * price;
            });
            const discount = parseFloat(document.getElementById('discount').value) || 0;
            const shipping = parseFloat(document.getElementById('shipping').value) || 0;
            const advance = parseFloat(document.getElementById('advanceAmount').value) || 0;
            const grandTotal = subtotal - discount + shipping;
            const balance = Math.max(0, grandTotal - advance);
            
            document.getElementById('subtotalDisplay').textContent = subtotal.toFixed(2) + ' PKR';
            document.getElementById('discountDisplay').textContent = discount.toFixed(2) + ' PKR';
            document.getElementById('shippingDisplay').textContent = shipping.toFixed(2) + ' PKR';
            document.getElementById('balanceDisplay').textContent = balance.toFixed(2) + ' PKR';
            
            return { subtotal, discount, shipping, advance, grandTotal, balance };
        }
        
        function saveOrder() {
            const name = document.getElementById('customerName').value.trim();
            const phone = document.getElementById('customerPhone').value.trim();
            if (!name || !phone) { showToast('Please enter customer name and phone!', true); return false; }
            
            const products = [];
            document.querySelectorAll('.product-row').forEach(row => {
                const pname = row.querySelector('.productName').value.trim();
                const qty = parseFloat(row.querySelector('.productQty').value) || 0;
                const price = parseFloat(row.querySelector('.productPrice').value) || 0;
                if (pname && price > 0) products.push({ name: pname, qty, price, total: qty*price });
            });
            if (products.length === 0) { showToast('Add at least one product!', true); return false; }
            
            const totals = calculateTotal();
            const paymentMethod = document.querySelector('input[name="payment"]:checked').value;
            
            currentOrder = {
                id: Date.now().toString(),
                customer: { name, phone, address: document.getElementById('customerAddress').value },
                products: products,
                payment: { method: paymentMethod, advanceAmount: totals.advance, paymentMethod: document.getElementById('paymentMethod').value, transactionId: document.getElementById('transactionId').value },
                details: {
                    invoiceNo: document.getElementById('invoiceNo').value,
                    date: document.getElementById('orderDate').value,
                    discount: totals.discount,
                    shipping: totals.shipping,
                    courier: document.getElementById('courier').value,
                    tracking: document.getElementById('tracking').value,
                    subtotal: totals.subtotal,
                    total: totals.grandTotal,
                    advancePaid: totals.advance,
                    balanceDue: totals.balance
                }
            };
            
            allOrders.unshift(currentOrder);
            updateCustomerDatabase(currentOrder);
            saveAllData();
            showToast('✅ Order saved!');
            updateStats();
            setTimeout(() => switchTab('orders'), 500);
            return true;
        }
        
        function updateCustomerDatabase(order) {
            const idx = allCustomers.findIndex(c => c.phone === order.customer.phone);
            if (idx === -1) {
                allCustomers.push({ name: order.customer.name, phone: order.customer.phone, address: order.customer.address, email: '', totalOrders: 1, totalSpent: order.details.total, orders: [order.id] });
            } else {
                allCustomers[idx].totalOrders++;
                allCustomers[idx].totalSpent += order.details.total;
                allCustomers[idx].orders.push(order.id);
            }
        }
        
        function loadAllData() {
            const savedOrders = localStorage.getItem('adkAllOrders');
            if (savedOrders) allOrders = JSON.parse(savedOrders);
            const savedCustomers = localStorage.getItem('adkAllCustomers');
            if (savedCustomers) allCustomers = JSON.parse(savedCustomers);
        }
        
        function saveAllData() {
            localStorage.setItem('adkAllOrders', JSON.stringify(allOrders));
            localStorage.setItem('adkAllCustomers', JSON.stringify(allCustomers));
        }
        
        function loadOrdersCards() {
            const container = document.getElementById('ordersContainer');
            if (allOrders.length === 0) { container.innerHTML = '<div class="empty-state" style="text-align:center;padding:40px;">No orders yet</div>'; return; }
            
            let html = '';
            allOrders.forEach(order => {
                html += `<div class="order-card">
                    <div><strong>${order.details.invoiceNo}</strong> | ${order.details.date}</div>
                    <div>${order.customer.name} | ${order.customer.phone}</div>
                    <div>Total: ${order.details.total.toFixed(2)} PKR | ${order.payment.method}</div>
                    <div style="margin-top:10px">
                        <button class="btn btn-small" onclick="viewOrder('${order.id}')">View</button>
                        <button class="btn btn-small btn-whatsapp" onclick="shareOrder('${order.id}')">WhatsApp</button>
                        <button class="btn btn-small btn-danger" onclick="deleteOrder('${order.id}')">Delete</button>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }
        
        function loadCustomersCards() {
            const container = document.getElementById('customersContainer');
            if (allCustomers.length === 0) { container.innerHTML = '<div class="empty-state" style="text-align:center;padding:40px;">No customers yet</div>'; return; }
            
            let html = '';
            allCustomers.forEach(cust => {
                html += `<div class="customer-card">
                    <div><strong>${cust.name}</strong> | ${cust.phone}</div>
                    <div>Orders: ${cust.totalOrders} | Total Spent: ${cust.totalSpent.toFixed(2)} PKR</div>
                    <div style="margin-top:10px">
                        <button class="btn btn-small btn-whatsapp" onclick="whatsAppCustomer('${cust.phone}')">WhatsApp</button>
                        <button class="btn btn-small btn-danger" onclick="deleteCustomer('${cust.phone}')">Delete</button>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }
        
        function viewOrder(id) {
            currentOrder = allOrders.find(o => o.id === id);
            viewInvoice();
            switchTab('create');
        }
        
        function shareOrder(id) {
            const order = allOrders.find(o => o.id === id);
            const msg = `*Invoice ${order.details.invoiceNo}*\nDear ${order.customer.name},\nTotal: ${order.details.total.toFixed(2)} PKR\nThank you!`;
            window.open(`https://wa.me/${order.customer.phone.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`, '_blank');
        }
        
        function deleteOrder(id) {
            if (confirm('Delete this order?')) {
                allOrders = allOrders.filter(o => o.id !== id);
                saveAllData();
                updateStats();
                loadOrdersCards();
                showToast('Order deleted');
            }
        }
        
        function deleteCustomer(phone) {
            if (confirm('Delete customer and all their orders?')) {
                allOrders = allOrders.filter(o => o.customer.phone !== phone);
                allCustomers = allCustomers.filter(c => c.phone !== phone);
                saveAllData();
                updateStats();
                loadCustomersCards();
                showToast('Customer deleted');
            }
        }
        
        function whatsAppCustomer(phone) {
            const cust = allCustomers.find(c => c.phone === phone);
            const msg = `Dear ${cust.name},\nThank you for your business!\nTotal Orders: ${cust.totalOrders}\nTotal Spent: ${cust.totalSpent.toFixed(2)} PKR`;
            window.open(`https://wa.me/${phone.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`, '_blank');
        }
        
        function viewInvoice() {
            if (!currentOrder.customer) { showToast('Save order first!', true); return; }
            let html = `<h2>ADK LaBs®</h2><h3>Invoice: ${currentOrder.details.invoiceNo}</h3>
            <p><strong>Customer:</strong> ${currentOrder.customer.name}<br><strong>Phone:</strong> ${currentOrder.customer.phone}<br><strong>Address:</strong> ${currentOrder.customer.address}</p>
            <table border="1" cellpadding="8" style="width:100%;border-collapse:collapse">`;
            html += `<tr style="background:#2c3e50;color:white"><th>Product</th><th>Qty</th><th>Price</th><th>Total</th></tr>`;
            currentOrder.products.forEach(p => { html += `<tr><td>${p.name}</td><td>${p.qty}</td><td>${p.price}</td><td>${p.total.toFixed(2)}</td></tr>`; });
            html += `</table><h3>Total: ${currentOrder.details.total.toFixed(2)} PKR</h3>`;
            document.getElementById('invoicePreview').innerHTML = html;
            document.getElementById('invoicePreview').style.display = 'block';
        }
        
        function shareInvoice() {
            if (!currentOrder.customer) { showToast('Save order first!', true); return; }
            const msg = `*Invoice ${currentOrder.details.invoiceNo}*\nCustomer: ${currentOrder.customer.name}\nTotal: ${currentOrder.details.total.toFixed(2)} PKR\nThank you!`;
            window.open(`https://wa.me/${currentOrder.customer.phone.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`, '_blank');
        }
        
        function exportData() {
            const data = JSON.stringify({ orders: allOrders, customers: allCustomers });
            const blob = new Blob([data], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `adk_data_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Data exported!');
        }
        
        function showImportModal() { document.getElementById('importModal').style.display = 'flex'; }
        function hideImportModal() { document.getElementById('importModal').style.display = 'none'; document.getElementById('importData').value = ''; }
        
        function importData() {
            try {
                const data = JSON.parse(document.getElementById('importData').value);
                if (data.orders) allOrders = data.orders;
                if (data.customers) allCustomers = data.customers;
                saveAllData();
                updateStats();
                hideImportModal();
                showToast('Data imported!');
            } catch(e) { showToast('Invalid data!', true); }
        }
        
        function clearAllData() {
            if (confirm('Delete ALL data?')) {
                if (confirm('Type "DELETE" to confirm:')) {
                    const confirmText = prompt('Type DELETE to confirm:');
                    if (confirmText === 'DELETE') {
                        allOrders = [];
                        allCustomers = [];
                        saveAllData();
                        updateStats();
                        showToast('All data cleared');
                    }
                }
            }
        }
        
        function clearForm() {
            document.getElementById('customerName').value = '';
            document.getElementById('customerPhone').value = '';
            document.getElementById('customerAddress').value = '';
            document.getElementById('discount').value = '0';
            document.getElementById('shipping').value = '0';
            document.getElementById('advanceAmount').value = '0';
            document.getElementById('invoiceNo').value = generateInvoiceNumber();
            document.getElementById('productsContainer').innerHTML = '';
            addProduct();
            calculateTotal();
        }
        
        function searchOrders() {
            const term = document.getElementById('searchOrders').value.toLowerCase();
            document.querySelectorAll('#ordersContainer .order-card').forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(term) ? '' : 'none';
            });
        }
        
        function searchCustomers() {
            const term = document.getElementById('searchCustomers').value.toLowerCase();
            document.querySelectorAll('#customersContainer .customer-card').forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(term) ? '' : 'none';
            });
        }
        
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }
    </script>
    
    <!-- FIXED SERVICE WORKER REGISTRATION -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // Register service worker with correct scope
                navigator.serviceWorker.register('/adk-invoice-pwa/sw.js', { 
                    scope: '/adk-invoice-pwa/' 
                })
                .then(reg => {
                    console.log('✅ Service Worker registered successfully!', reg);
                    
                    // Check for updates
                    reg.onupdatefound = () => {
                        const installingWorker = reg.installing;
                        installingWorker.onstatechange = () => {
                            if (installingWorker.state === 'installed') {
                                if (navigator.serviceWorker.controller) {
                                    console.log('🔄 New content available - refresh to update');
                                    const toast = document.getElementById('toast');
                                    if (toast) {
                                        toast.textContent = '🔄 App updated! Refresh to get latest version';
                                        toast.style.display = 'block';
                                        setTimeout(() => toast.style.display = 'none', 5000);
                                    }
                                }
                            }
                        };
                    };
                })
                .catch(err => {
                    console.log('❌ Service Worker registration failed:', err);
                });
            });
        }
        
        // Handle offline detection
        window.addEventListener('online', () => {
            console.log('🟢 App is online');
        });
        
        window.addEventListener('offline', () => {
            console.log('🔴 App is offline - working from cache');
        });
    </script>
</body>
